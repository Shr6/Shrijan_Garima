<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrijan &amp; Garima</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 6vw;
    position:relative;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;
    inset:0;
    z-index:-1;
  }
  .hero-bg img{
    width:100%; height:100%;
    object-fit:cover;
    object-position:50% 25%;
    filter:saturate(0.85) brightness(1.02);
    opacity:0;
    animation:bgIn 2.4s ease forwards 0.1s;
  }
  @keyframes bgIn{
    from{opacity:0; transform:scale(1.08);}
    to{opacity:1; transform:scale(1);}
  }
  .hero-bg::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(to bottom, rgba(251,244,238,0.55) 0%, rgba(251,244,238,0.88) 68%, var(--cream) 100%),
      linear-gradient(120deg, rgba(217,142,146,0.18), rgba(201,162,101,0.1));
  }
  .hero-eyebrow{
    font-family:'Marcellus', serif;
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:0.68rem;
    color:var(--deep-rose);
    opacity:0;
    animation:fadeUp 1s ease forwards 0.5s;
  }
  .hero-names{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(3rem, 11vw, 7.5rem);
    line-height:1.02;
    color:var(--ink);
    margin-top:0.6rem;
    opacity:0;
    animation:fadeUp 1.1s ease forwards 0.75s;
  }
  .hero-amp{
    display:inline-block;
    font-style:italic;
    color:var(--rose);
    font-size:0.8em;
    margin:0 0.15em;
  }
  .hero-sub{
    font-family:'Poppins', sans-serif;
    font-weight:300;
    font-size:0.95rem;
    color:var(--ink-soft);
    margin-top:1.4rem;
    max-width:34ch;
    line-height:1.7;
    opacity:0;
    animation:fadeUp 1.1s ease forwards 1.05s;
  }
  .hero-thread{
    margin-top:2.6rem;
    width:120px;
    opacity:0;
    animation:fadeUp 1.1s ease forwards 1.3s;
  }
  .hero-cta{
    margin-top:2.8rem;
    opacity:0;
    animation:fadeUp 1.1s ease forwards 1.55s;
  }
  .hero-cta a{
    display:inline-block;
    padding:0.85rem 2.2rem;
    border:1px solid var(--deep-rose);
    color:var(--deep-rose);
    font-family:'Marcellus', serif;
    font-size:0.72rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    border-radius:2px;
    transition:background 0.35s ease, color 0.35s ease;
  }
  .hero-cta a:hover{
    background:var(--deep-rose);
    color:#fff;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }
  .scroll-cue{
    position:absolute;
    bottom:4.5vh;
    font-size:0.62rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0;
    animation:fadeUp 1s ease forwards 1.8s, bob 2.4s ease-in-out infinite 2.8s;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="brand">S &amp; G</div>
  <div class="dots">
    <a href="index.html" title="Home"></a>
    <a href="story.html" title="Our Story"></a>
    <a href="gallery.html" title="Gallery"></a>
    <a href="propose.html" title="The Question"></a>
  </div>
</nav>

<div class="wrap">
  <section class="hero">
    <div class="hero-bg">
      <img src="assets/img/photo5.jpg" alt="Shrijan and Garima looking out at the sky together">
    </div>
    <div class="hero-eyebrow">A Kartik Story</div>
    <h1 class="hero-names">Shrijan<span class="hero-amp">&amp;</span>Garima</h1>
    <p class="hero-sub">Three days in Kartik, a June morning we finally met, and everything after.</p>
    <svg class="hero-thread" viewBox="0 0 120 20" fill="none">
      <path d="M2 10 C 30 -4, 50 24, 60 10 C 70 -4, 90 24, 118 10" stroke="#D98E92" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="60" cy="10" r="3" fill="#B4646C"/>
    </svg>
    <div class="hero-cta">
      <a href="story.html">Read Our Story</a>
    </div>
    <div class="scroll-cue">scroll ↓</div>
  </section>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
