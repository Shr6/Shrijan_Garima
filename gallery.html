<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Shrijan &amp; Garima</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .page-top{height:14vh;}

  .masonry{
    max-width:1100px;
    margin:0 auto;
    padding:0 6vw 4vh;
    columns:3 220px;
    column-gap:16px;
  }
  .m-item{
    break-inside:avoid;
    margin-bottom:16px;
    border-radius:2px;
    overflow:hidden;
    box-shadow:0 14px 32px -18px rgba(74,58,60,0.35);
    position:relative;
  }
  .m-item img, .m-item video{
    width:100%;
    display:block;
    transition:transform 0.6s ease, filter 0.6s ease;
    filter:saturate(0.92);
  }
  .m-item:hover img{transform:scale(1.045);}
  .m-item .tag{
    position:absolute;
    bottom:0; left:0; right:0;
    padding:0.9rem 1rem 0.7rem;
    font-family:'Marcellus', serif;
    font-size:0.62rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:#fff;
    background:linear-gradient(to top, rgba(74,58,60,0.65), transparent);
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .m-item:hover .tag{opacity:1;}

  .video-note{
    text-align:center;
    max-width:44ch;
    margin:1rem auto 5vh;
    font-size:0.82rem;
    line-height:1.7;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="brand" href="index.html">S &amp; G</a>
  <div class="dots">
    <a href="index.html" title="Home"></a>
    <a href="story.html" title="Our Story"></a>
    <a href="gallery.html" title="Gallery"></a>
    <a href="propose.html" title="The Question"></a>
  </div>
</nav>

<div class="wrap">
  <div class="page-top"></div>

  <section class="section-head">
    <div class="eyebrow">Us</div>
    <h2>A few of our moments</h2>
  </section>

  <section class="masonry reveal">
    <div class="m-item">
      <img src="assets/img/photo1.jpg" alt="Shrijan and Garima laughing together">
      <div class="tag">Kartik 25</div>
    </div>
    <div class="m-item">
      <video src="assets/video/us.mp4" autoplay muted loop playsinline></video>
      <div class="tag">Us, on video</div>
    </div>
    <div class="m-item">
      <img src="assets/img/photo2.jpg" alt="Shrijan and Garima making playful faces">
      <div class="tag">Kartik 26</div>
    </div>
    <div class="m-item">
      <img src="assets/img/photo3.jpg" alt="Shrijan and Garima standing together at a cafe">
      <div class="tag">June 7</div>
    </div>
    <div class="m-item">
      <img src="assets/img/photo5.jpg" alt="Shrijan and Garima looking out at the sky together">
      <div class="tag">June 7</div>
    </div>
    <div class="m-item">
      <img src="assets/img/photo4.jpg" alt="Shrijan and Garima sitting close together">
      <div class="tag">June 7</div>
    </div>
  </section>

  <p class="video-note">A short clip from that first day in person, on loop, because it's still our favorite one to rewatch.</p>

  <div class="next-link">
    <a href="propose.html">
      <div class="lbl">One More Thing</div>
      <div class="arrow">↓</div>
    </a>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
